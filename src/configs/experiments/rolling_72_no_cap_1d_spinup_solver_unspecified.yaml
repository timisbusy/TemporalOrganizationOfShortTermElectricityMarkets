# Diagnostic variant of rolling_72_no_cap_1d_spinup.yaml - identical in every respect except
# solver_method, used to test whether the small isolated discrepancies found against Laura's
# reference decision variables (LP degeneracy at price-equals-bid-price ties, e.g. Base @
# EUR30/MWh or ModerateBid @ EUR50/MWh - see the Rolling48h/Rolling72h validation) are driven by
# forcing HiGHS to "simplex" rather than leaving its solver method unspecified (HiGHS's own
# default, "choose", which is what an external reference run gets if it never sets the option
# explicitly) - different solvers/methods can land on different vertices among tied LP optima.

name: rolling_72_no_cap_1d_spinup_solver_unspecified # descriptive name for experiment

# Set temporal parameters for experiment - granularity and duration
timePeriodsPerDay: 24 # number of time periods in a day
clearForDays: 32 # number of days to clear market for - one more than the 36h/48h configs. With
# a 72-MTU look-ahead window, the natural last-auction bound (clearForDays*24 -
# optimizationWindow) is only 31*24-72=672 at 31 days, which falls 23 MTUs short of MTU 695 -
# the last MTU needed for the day-28 price-analysis window - so auctions covering the tail of
# the analysis window would silently be missing. 32 days pushes the bound to 32*24-72=696,
# which clears MTU 695 (same 1-MTU margin as the 48h config).
skipEarlyAuctions: 12
samplePeriodExcludeSpinUp: 1 # 1 full day, not 0.5 - leaves a clean 28-day analysis window
# (MTU 24:695) instead of the 28.5-day window (MTU 12:672) that 0 days combined with
# skipEarlyAuctions=12 produced. skipEarlyAuctions itself is unchanged (clearing still starts
# at MTU 12) - this just widens the excluded buffer between "clearing started" and "counts as
# analyzed data" to a full day.
samplePeriodExcludeEnd: 3 # 3 days, not 2 - clearForDays is one day longer than the 36h/48h
# configs (to give the 72h window enough auction runway), so the exclusion window is widened by
# that same extra day to keep the analyzed range identical (MTU 24:695, a 28-day window) across
# all three look-ahead-window experiments rather than shifting it out to a 29th day.

# set a start date for data to be used from incoming agent profile data
startDate: 2025-05-01

# set the uncertainty in renewable generation
noiseLevel: 0.2
windOffset: 11


# choose a market configuration from the markets directory
marketConfig: rolling_72_laura.yaml

# choose an agent configuration from the agents directory
agentConfig: validate_laura_agents.yaml

# for optimization model customization
optimizationModelConfig:
  model: latest
  solver: highs
  solver_method: unspecified
  demand_adjust: false
  ex_post_transactions: false
  restrict_mtu1_trading: true
