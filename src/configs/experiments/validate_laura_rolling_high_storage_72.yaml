# general parameters

name: validate_laura_rolling_high_storage_72 # descriptive name for experiment

# Set temporal parameters for experiment - granularity and duration
timePeriodsPerDay: 24 # number of time periods in a day
clearForDays: 31 # number of days to clear market for - 31, not 30: with a 72-MTU look-ahead
# window, ClearSimple's own natural bound (clearForDays*24 - window) is 720-72=648 at 30 days,
# which is LESS than lastAuctionMTU below and would silently win the min() in clear_market.jl,
# capping the run 24 MTUs short of 672 with no error. 31 days pushes the natural bound to
# 744-72=672, matching lastAuctionMTU exactly (the same relationship 36h/48h already have,
# where the natural bound already exceeds/equals 672) - confirmed against Laura's own results,
# which diverged from ours specifically at the tail (SOC end of horizon, last-few-MTU dispatch,
# imbalance) before this fix, matching exactly a 24-MTU-short run.
skipEarlyAuctions: 12
lastAuctionMTU: 672 # cap the last clearing to match Laura's comparable_delivery_hours_override -
# a single shared constant (661 clearings) she applies uniformly across her 36h/48h/72h scenarios
# so every look-ahead horizon executes the same number of clearings, not a per-horizon natural
# bound (see run_thesis_cases.jl/thesis_runner.jl in her codebase)
samplePeriodExcludeSpinUp: 0
samplePeriodExcludeEnd: 0

# set a start date for data to be used from incoming agent profile data
startDate: 2025-05-01

# set the uncertainty in renewable generation
noiseLevel: 0.2
windOffset: 11


# choose a market configuration from the markets directory
marketConfig: rolling_72_laura.yaml

# choose an agent configuration from the agents directory
agentConfig: validate_laura_agents_high_storage.yaml

# for optimization model customization
optimizationModelConfig:
  model: latest
  solver: highs
  solver_method: simplex
  demand_adjust: false
  ex_post_transactions: false
  restrict_mtu1_trading: true
